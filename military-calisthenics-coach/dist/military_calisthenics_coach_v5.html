<title>عزم · AZM — مدربك الشخصي للياقة</title>
<style id="figcss">.mc-fig{width:100%;height:auto;display:block;background:var(--fig-bg,#0f2232);border-radius:10px}
.mc-floor{stroke:var(--fig-floor,#5f7a8f);stroke-width:2}
.mc-prop{stroke:var(--fig-prop,#8aa0b4);stroke-width:3;fill:none;stroke-linecap:round}
.mc-prop-fill{fill:var(--fig-prop-fill,#3a5166);stroke:var(--fig-prop,#8aa0b4);stroke-width:1.5}
.mc-post{stroke-width:2;stroke-dasharray:3 3}
.mc-mat{fill:var(--fig-mat,#2f6e63)}
.mc-body polyline,.mc-body line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mc-near polyline,.mc-near line{stroke:var(--fig,#ffd166);stroke-width:7}
.mc-far polyline,.mc-far line{stroke:var(--fig-far,#b48a2c);stroke-width:7}
.mc-torso{stroke:var(--fig,#ffd166);stroke-width:11}
.mc-neck{stroke:var(--fig,#ffd166);stroke-width:5}
.mc-head{fill:var(--fig,#ffd166)}
.mc-towel{stroke:var(--fig-towel,#7fd1ff);stroke-width:3;stroke-dasharray:4 2}
.mc-ghost polyline{fill:none;stroke:var(--fig-ghost,#7fa3c0);stroke-opacity:.35;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.mc-ghost circle{fill:var(--fig-ghost,#7fa3c0);fill-opacity:.3}
.mc-trace{fill:none;stroke:var(--fig-trace,#5ee0c1);stroke-width:1.6;stroke-dasharray:3 3}
.mc-mirror{transform:scaleX(-1)}
.mc-inset{fill:var(--fig-bg,#0f2232);stroke:var(--fig-prop,#8aa0b4);stroke-width:1}
.mc-inset-body{fill:var(--fig-ghost,#7fa3c0);fill-opacity:.55}
.mc-inset-sh{stroke:var(--fig-ghost,#7fa3c0);stroke-width:2}
.mc-inset-hand{fill:var(--fig,#ffd166)}
.mc-plate{fill:var(--fig-load,#9a9a92);stroke:var(--fig-bg,#0f2232);stroke-width:1.2}
.mc-bar{stroke:var(--fig-load,#9a9a92);stroke-width:3.5;stroke-linecap:round}
.mc-cable{stroke:var(--fig-load,#9a9a92);stroke-width:1.5;stroke-dasharray:3 2}
.mc-stack{fill:var(--fig-prop-fill,#3a5166);stroke:var(--fig-prop,#8aa0b4);stroke-width:1}

<style>:root{
  --bg:#0d0e0b;--bg2:#141510;--panel:#1b1c16;--panel2:#23251d;--line:#3b3d31;--text:#ece9dd;--muted:#aaa896;
  --acc:#c3b091;--acc2:#9aa25f;--acc-ink:#16150c;--acc2-ink:#12140a;--danger:#ff8a7a;--danger-bg:#3a1d1a;--warn:#e7c46a;--warn-bg:#352c16;--ok:#a9c77d;--ok-bg:#1f2a17;--info-bg:#22251c;
  --fig:#d9c89b;--fig-far:#8d7f58;--fig-bg:#15160f;--fig-floor:#5c5e51;--fig-prop:#8e9081;--fig-prop-fill:#34362b;--fig-ghost:#8f8f7d;--fig-trace:#b7c27a;--fig-mat:#4b5320;--fig-load:#b9b9ad;
  --radius:12px;--shadow:0 8px 28px rgba(0,0,0,.45);
  font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arial",Tahoma,sans-serif;color-scheme:dark;
}
:root[data-theme=light]{--bg:#ebe7da;--bg2:#e1dccb;--panel:#faf8f1;--panel2:#f1eee2;--line:#c8c1aa;--text:#1a1b15;--muted:#535345;--acc:#5f532a;--acc2:#4b5320;--acc-ink:#fff;--acc2-ink:#fff;
  --danger:#a42617;--danger-bg:#fbe7e3;--warn:#6f4f00;--warn-bg:#fbf0d4;--ok:#3f5a17;--ok-bg:#e7efd9;--info-bg:#efece0;--fig:#3d4320;--fig-far:#9aa07c;--fig-bg:#f4f1e6;--fig-floor:#8a8a78;--fig-prop:#6c6c5c;--fig-prop-fill:#d9d4c2;--fig-ghost:#a9a790;--fig-trace:#6b7a1f;--fig-mat:#c9cfa0;--fig-load:#55554b;--shadow:0 6px 18px rgba(40,40,20,.12);color-scheme:light}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
a{color:var(--acc2)}
h1,h2,h3,h4{line-height:1.35;margin:.2em 0 .5em}
h2{font-size:1.45rem}h3{font-size:1.15rem}
.skip{position:absolute;inset-inline-start:-999px;top:0}.skip:focus{inset-inline-start:8px;z-index:99;background:var(--acc);color:var(--acc-ink);padding:8px 12px;border-radius:8px}
header.top{background:linear-gradient(135deg,#0b0c09,#1b1d14 55%,#2a2c1f);border-bottom:3px solid var(--acc);padding:14px 4vw;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
:root[data-theme=light] header.top{background:linear-gradient(135deg,#2a2c1f,#4b5320);color:#fff}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 320px}
.brand svg{width:48px;height:48px;flex:none}
.brand h1{font-size:1.35rem;margin:0;color:#fff}.brand small{color:#c9d6e2;display:block;font-size:.8rem}
.topctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topctl select{min-width:220px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;border:1px solid transparent;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:currentColor}.b-warn{background:var(--warn-bg);color:var(--warn);border-color:currentColor}.b-danger{background:var(--danger-bg);color:var(--danger);border-color:currentColor}.b-info{background:var(--info-bg);color:var(--text);border-color:var(--line)}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 80px)}
nav.side{background:var(--bg2);border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
nav.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:transparent;color:var(--text);border:0;border-radius:10px;padding:10px 12px;font-size:.98rem;cursor:pointer;margin:2px 0}
nav.side button:hover{background:var(--panel)}
nav.side button[aria-current=page]{background:var(--panel2);box-shadow:inset -4px 0 0 var(--acc);font-weight:700}
nav.side .ico{width:22px;text-align:center;opacity:.9}
main{padding:22px 3vw 60px;max-width:1280px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--panel2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}.grow{flex:1 1 220px}
.muted{color:var(--muted)}.small{font-size:.85rem}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:1.7rem;color:var(--acc)}
button,.btn{font:inherit;border:1px solid transparent;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;min-height:42px}
button.sec{background:var(--panel2);color:var(--text);border-color:var(--line)}
button.ghost{background:transparent;color:var(--text);border-color:var(--line)}
button.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
button.ok{background:var(--acc2);color:var(--acc2-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
label{display:block;margin:8px 0;font-weight:600}
label .hint{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
input,select,textarea{font:inherit;display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--text);padding:9px 11px;margin-top:4px;min-height:42px}
input[type=checkbox],input[type=radio]{display:inline-block;width:20px;height:20px;min-height:0;margin:0 0 0 6px;vertical-align:middle;accent-color:var(--acc2)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
legend{font-weight:700;padding:0 6px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}.checks label{font-weight:400;margin:4px 0}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:start;vertical-align:top}
th{color:var(--muted);font-size:.85rem;font-weight:700}
.scroll{overflow:auto}
.alert{border-radius:12px;padding:12px 14px;margin:10px 0;border:1px solid var(--line);background:var(--info-bg)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn)}.alert.danger{background:var(--danger-bg);border-color:var(--danger)}.alert.ok{background:var(--ok-bg);border-color:var(--ok)}
.alert b:first-child{display:block}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;background:var(--panel2);border:1px solid var(--line);margin:2px}
.empty{padding:30px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.excard{display:flex;flex-direction:column;cursor:pointer;padding:12px;text-align:start;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);font-weight:400}
.excard:hover{border-color:var(--acc)}
.excard .thumb{border-radius:10px;overflow:hidden;margin-bottom:8px}
.excard h4{margin:0;font-size:1rem}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;width:min(1100px,96vw);max-height:94vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-body{padding:16px 18px;overflow:auto;max-height:calc(94vh - 70px)}
.player{display:grid;grid-template-columns:minmax(280px,1.2fr) 1fr;gap:18px}
.stage{position:relative}
.stage .phase{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ctl input[type=range]{flex:1 1 140px;min-height:0}
.counter{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bignum{font-size:3.2rem;font-weight:800;color:var(--acc);text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.bigbtn{font-size:1.4rem;min-height:64px;min-width:64px}
.steps li{margin:4px 0}
.day{border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden;background:var(--panel)}
.day>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel2)}
.day>summary::-webkit-details-marker{display:none}
.day .inner{padding:10px 16px}
.item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:start;border-bottom:1px dashed var(--line);padding:10px 0}
.item .thumb{width:120px}
.why{font-size:.82rem;color:var(--muted)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stepper span{padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.85rem}
.stepper span.on{background:var(--acc);color:var(--acc-ink)}
.stepper span.done{background:var(--ok-bg);color:var(--ok)}
.q{border-bottom:1px solid var(--line);padding:8px 0}
.q .must{color:var(--danger);font-size:.8rem;margin-inline-start:6px}
.stopbar{position:sticky;bottom:0;background:var(--danger-bg);border:2px solid var(--danger);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.chart{width:100%;height:auto;background:var(--panel2);border-radius:10px}
.chart text{fill:var(--muted);font-size:10px}
footer.foot{padding:16px 3vw;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:16px;inset-inline-start:16px;background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#print{display:none}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav.side{position:static;display:flex;overflow:auto;max-height:none;border:0;border-bottom:1px solid var(--line)}nav.side button{width:auto;white-space:nowrap}.player{grid-template-columns:1fr}.item{grid-template-columns:84px 1fr}.item .thumb{width:84px}.item>.act{grid-column:1/-1}html{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* ---------- print (A4 weekly plan) ---------- */
@media print{
  @page{size:A4;margin:12mm 11mm 14mm}
  html{font-size:10.5pt}
  body{background:#fff!important;color:#000!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;--fig:#123;--fig-far:#7d8d9c;--fig-bg:#fff;--fig-floor:#666;--fig-prop:#555;--fig-prop-fill:#ddd;--fig-ghost:#999;--fig-trace:#0a7;--fig-mat:#cde}
  #print *{color:#000!important;box-shadow:none!important}
  #print .p-head{border-bottom:2.5px solid #000;padding-bottom:6px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px}
  #print h1{font-size:15pt;margin:0}#print h2{font-size:12.5pt;margin:10px 0 4px;break-after:avoid}#print h3{font-size:11pt;margin:6px 0 2px;break-after:avoid}
  #print table{width:100%;border-collapse:collapse;font-size:9.3pt}
  #print th,#print td{border:1px solid #777;padding:3px 5px;vertical-align:top}
  #print th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print thead{display:table-header-group}
  #print tr,#print .exs,#print .p-box{break-inside:avoid}
  #print .exs{display:grid;grid-template-columns:42mm 42mm 1fr;gap:6px;border:1px solid #999;padding:5px;margin:5px 0;border-radius:4px}
  #print .exs svg{border:1px solid #ccc;border-radius:4px}
  #print .p-box{border:1.5px solid #000;padding:6px 8px;margin:6px 0;border-radius:4px}
  #print .pb{break-before:page}
  #print .meta{font-size:8.5pt}
  #print .fb td{height:9mm}
}
/* ---------- simple mode (v5.1) ---------- */
.en{color:var(--muted);font-size:.82em;font-weight:400;unicode-bidi:isolate}
nav.side small.en{display:block;line-height:1.1}
.center{text-align:center}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:10px 0 18px}
button.big{min-height:64px;font-size:1.15rem;padding:14px 18px;border-radius:14px;width:100%}
form[data-form=setup]>button.big{max-width:420px}
.q .qt{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg2);cursor:pointer;font-weight:600;color:var(--text);min-height:44px}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip:has(input:checked),.chip.on{border-color:var(--acc);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--acc)}
.chip:has(input:focus-visible){outline:3px solid var(--acc2);outline-offset:2px}
.chip:has(input:disabled){opacity:.45;cursor:not-allowed}
button.chip{font:inherit}
.linkbtn{background:none;border:0;color:var(--acc2);padding:0;min-height:0;font-weight:600;text-decoration:underline;cursor:pointer}
.dico{font-size:1.3rem}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pill.wk{border-color:var(--warn);color:var(--warn)}
.vid a{font-weight:700}
details.why summary{cursor:pointer;color:var(--muted);font-size:.82rem}
@media print{
  #print .p-head{display:flex;justify-content:space-between}
  #print .pname{font-size:14pt;font-weight:700}
  #print .en{color:#444!important}
  #print .exs{display:grid;grid-template-columns:70mm 1fr;gap:8px}
  #print .pics{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  #print .pics small{display:block;text-align:center;font-size:8pt}
  #print .enname{font-weight:700;font-size:11pt}
  #print .dose{border:1px solid #999;border-radius:4px;padding:2px 6px;margin:3px 0;font-weight:700}
  #print .exs ol{margin:2px 18px 2px 0;padding:0}
  #print .vid a{color:#0645ad!important;text-decoration:underline}
  #print .foot{margin-top:8px;border-top:1px solid #999;padding-top:4px}
}
.qt .en,legend .en,h2 .en,.alert .en,label>.en{display:block;margin-top:1px}
.lead{margin:0 0 10px}.lead .en{display:block}
button .en,.badge .en{color:inherit}

/* ---------- AZM brand ---------- */
.brand h1{font-size:1.6rem;letter-spacing:.5px}
.brand h1 .en{color:#c3b091;font-size:.62em;letter-spacing:3px;margin-inline-start:6px}
.brand small{color:#bdb9a4}
header.top{border-bottom:3px solid #c3b091;background-image:repeating-linear-gradient(135deg,rgba(195,176,145,.05) 0 8px,transparent 8px 16px),linear-gradient(135deg,#0b0c09,#1b1d14 55%,#2a2c1f)}
nav.side button[aria-current=page]{box-shadow:inset -4px 0 0 var(--acc)}
.card{border-top:2px solid color-mix(in srgb,var(--acc) 35%,transparent)}

/* motivation & goals */
.motiv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.motiv .rank,.rankbig{font-weight:800;color:var(--acc)}
.rankbig{font-size:1.5rem}
.goal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.bar{height:12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .6s ease}
.hero-msg{text-align:center}
.pill.goalp{border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<a class="skip" href="#view">تخطي إلى المحتوى</a>
<header class="top">
  <div class="brand"><svg viewBox="0 0 64 64" role="img" aria-label="شعار عزم"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6c6a0"/><stop offset="1" stop-color="#9c8a5f"/></linearGradient></defs><path d="M32 3l24 8v17c0 16-10 27-24 33C18 55 8 44 8 28V11z" fill="url(#lg)" stroke="#0b0c09" stroke-width="2"/><path d="M32 9l18 6v13c0 12-7.5 20.5-18 25.5C21.5 48.5 14 40 14 28V15z" fill="#14150f"/><path d="M20 36l12-8 12 8M20 44l12-8 12 8" fill="none" stroke="#c3b091" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M32 13l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#c3b091"/></svg>
    <div><h1>عزم <span class="en" dir="ltr">AZM</span></h1><small>مدربك الشخصي للياقة · Your fitness coach · <span id="appver"></span> · يعمل دون إنترنت</small></div></div>
  <div class="topctl"><label class="sr" for="activeTrainee">المتدرب النشط</label><select id="activeTrainee"></select><span id="storeStatus" class="badge b-info" role="status">…</span><button class="ghost" data-act="theme" aria-label="تبديل الوضع الفاتح/الداكن" style="color:#fff;border-color:#fff4">◐</button></div>
</header>
<div class="layout">
  <nav class="side" aria-label="الأقسام" id="nav"></nav>
  <div><main id="view" tabindex="-1"></main>
  <footer class="foot">عزم · AZM — أداة مساعدة للمدرب وليست تشخيصاً أو تصريحاً طبياً ولا تضمن عدم الإصابة. لا اتصال بالشبكة، لا إعلانات، لا تتبع. البيانات في هذا المتصفح فقط — صدّر JSON بانتظام. الرسوم المتحركة أصلية مولدة برمجياً.</footer></div>
</div>

<script>/* ==== src/anim.js ==== */
/* MCAnim — original 2D articulated-figure animation engine (no external assets).
 * Coordinate system: SVG viewBox 0 0 240 160, y grows downward, floor at y=150.
 * Angles are in degrees with the mathematical convention: 0 = pointing right, 90 = pointing up.
 * A pose:
 *   h : [x,y]  hip-centre position
 *   t : torso angle (hip -> neck). 90 = upright.
 *   n : head offset relative to torso (deg), default 0
 *   a : [armNear, armFar]   each either [upperArmAngle, forearmAngle] (forward kinematics)
 *                           or {p:[x,y], b:+1|-1} (two-bone inverse kinematics, wrist target, bend side)
 *   l : [legNear, legFar]   same, for thigh/shin; IK target is the ankle
 *   f : [footNear, footFar] absolute foot angles (ankle -> toes), default 0 (side) / 180,0 (front)
 *   k : optional [torso, armNear, armFar, legNear, legFar] length multipliers to depict foreshortening (segments pointing toward/away from the viewer)
 * Exercise animation spec: {view:'side'|'front', top:bool (seen from above: no floor line, no floor checks), props:[...], keys:[{p:pose, d:ms, lab:'..'}], hang:bool, air:[keyIdx]}

(function (root) {

  function ik(rootP, target, a, b, bend) {
    var dx = target[0] - rootP[0], dy = target[1] - rootP[1];
    var d = Math.sqrt(dx * dx + dy * dy);
    var dc = Math.max(Math.abs(a - b) + 0.01, Math.min(a + b - 0.01, d));
    var th = Math.atan2(dy, dx);
    var cosA = (a * a + dc * dc - b * b) / (2 * a * dc);

    var j = [rootP[0] + a * Math.cos(ang), rootP[1] + a * Math.sin(ang)];

    var end = [j[0] + ex / el * b, j[1] + ey / el * b];

      var j = add(rootP, dir(spec[0]), a);

  /* Forward kinematics: returns joint positions and IK reach errors. */
  function solve(p, view) {
    var front = view === 'front';
    var k = p.k || [1, 1, 1, 1, 1]; /* foreshortening: [torso, armNear, armFar, legNear, legFar] length multipliers (0.3–1) */
    var hip = p.h, td = dir(p.t);

        case 'table':

          el('line', { x1: pr.x + 4, y1: FLOOR - pr.h, x2: pr.x + 4, y2: FLOOR, 'class': 'mc-prop' }, g);
          el('line', { x1: pr.x + pr.w - 4, y1: FLOOR - pr.h, x2: pr.x + pr.w - 4, y2: FLOOR, 'class': 'mc-prop' }, g);
          break;
        case 'bar':
          el('line', { x1: pr.x1, y1: pr.y, x2: pr.x2, y2: pr.y, 'class': 'mc-prop', 'stroke-width': 4 }, g);
          el('line', { x1: pr.x1, y1: pr.y, x2: pr.x1, y2: pr.post === false ? pr.y : FLOOR, 'class': 'mc-prop mc-post' }, g);
          el('line', { x1: pr.x2, y1: pr.y, x2: pr.x2, y2: pr.post === false ? pr.y : FLOOR, 'class': 'mc-prop mc-post' }, g);

          el('circle', { cx: cx, cy: gy + 9, r: 4.5, 'class': 'mc-inset-body' }, g);
          el('rect', { x: cx - 8, y: gy + 15, width: 16, height: 24, rx: 4, 'class': 'mc-inset-body' }, g);
          el('line', { x1: cx - 12, y1: gy + 17, x2: cx + 12, y2: gy + 17, 'class': 'mc-inset-sh' }, g);
          [-1, 1].forEach(function (sgn) { var hx = cx + sgn * 12 * pr.r; el('rect', { x: hx - 3, y: gy + 18, width: 6, height: 9, rx: 2, 'class': 'mc-inset-hand' }, g); el('line', { x1: cx + sgn * 12, y1: gy + 17, x2: hx, y2: gy + 22, 'class': 'mc-inset-sh' }, g); });

          el('line', { x1: pr.x + 6, y1: FLOOR - pr.h + 6, x2: pr.x + 6, y2: FLOOR, 'class': 'mc-prop' }, g);
          el('line', { x1: pr.x + pr.w - 6, y1: FLOOR - pr.h + 6, x2: pr.x + pr.w - 6, y2: FLOOR, 'class': 'mc-prop' }, g); break;
        case 'rack': el('line', { x1: pr.x, y1: pr.y || 40, x2: pr.x, y2: FLOOR, 'class': 'mc-prop' }, g); el('line', { x1: pr.x - 6, y1: pr.hook || 60, x2: pr.x + 6, y2: pr.hook || 60, 'class': 'mc-prop' }, g); break;
        case 'mat': el('rect', { x: pr.x1, y: FLOOR - 2, width: pr.x2 - pr.x1, height: 3, rx: 1, 'class': 'mc-mat' }, g); break;
        case 'step': el('rect', { x: pr.x, y: FLOOR - pr.h, width: pr.w, height: pr.h, rx: 1, 'class': 'mc-prop-fill' }, g); break;

      }
    });
  }

  /* Build an animated figure inside container. Returns controller. */
  function Figure(container, spec, opts) {
    opts = opts || {};
    this.spec = spec; this.t = opts.t || 0; this.speed = 1; this.playing = !!opts.autoplay;
    this.onLabel = opts.onLabel || null;

    if (opts.title) { var ti = el('title', {}, svg); ti.textContent = opts.title; }
    var floor = spec.top || (spec.hang && spec.floor === false) ? null : el('line', { x1: 4, y1: FLOOR + 1.5, x2: 236, y2: FLOOR + 1.5, 'class': 'mc-floor' }, svg);
    drawProps(el('g', {}, svg), spec.props);
    this.ghost = el('g', { 'class': 'mc-ghost' }, svg);
    this.trace = el('path', { 'class': 'mc-trace', d: '' }, svg);

    var far = el('g', { 'class': spec.view === 'front' ? 'mc-near' : 'mc-far' }, g);

      aF: el('polyline', {}, far), lF: el('polyline', {}, far), fF: el('line', {}, far),
      towel: el('line', { 'class': 'mc-towel' }, g),
      torso: el('line', { 'class': 'mc-torso' }, g), neck: el('line', { 'class': 'mc-neck' }, g),
      head: el('circle', { r: L.head, 'class': 'mc-head' }, g)
    };
    var near = el('g', { 'class': 'mc-near' }, g);
    this.p.lN = el('polyline', {}, near); this.p.fN = el('line', {}, near); this.p.aN = el('polyline', {}, near);
    /* gym equipment attached to joints: dumbbell 'db', kettlebell 'kb', barbell end-on 'bb', barbell seen from the front 'bbline', cable 'cable' */
    this.att = (spec.props || []).filter(function (q) { return q.at; }).map(function (q) {
      var gg = el('g', { 'class': 'mc-load' }, svg), o = { q: q, g: gg, e: [] };
      var ats = q.at === 'both' ? ['wrN', 'wrF'] : [q.at];
      if (q.k === 'cable') { o.e.push(el('line', { 'class': 'mc-cable' }, gg)); el('circle', { cx: q.to[0], cy: q.to[1], r: 4, 'class': 'mc-prop-fill' }, gg); el('rect', { x: q.to[0] - 5, y: q.to[1], width: 10, height: 150 - q.to[1], 'class': 'mc-stack' }, gg); }
      else if (q.k === 'bbline') { o.e.push(el('line', { 'class': 'mc-bar' }, gg)); o.e.push(el('rect', { width: 5, height: 22, rx: 1.5, 'class': 'mc-plate' }, gg)); o.e.push(el('rect', { width: 5, height: 22, rx: 1.5, 'class': 'mc-plate' }, gg)); }
      else ats.forEach(function () {

        else if (q.k === 'kb') o.e.push(el('circle', { r: 6, 'class': 'mc-plate' }, gg));

    while (gg.firstChild) gg.removeChild(gg.firstChild);
    [[s.shN, s.elN, s.wrN], [s.shF, s.elF, s.wrF], [s.hpN, s.knN, s.anN, s.toeN], [s.hpF, s.knF, s.anF, s.toeF], [s.hip, s.neck]].forEach(function (a) { el('polyline', { points: pts(a) }, gg); });
    el('circle', { cx: s.head[0], cy: s.head[1], r: L.head }, gg);
    var j = traceJoint || this.spec.trace;
    if (j) {
      var d = [], total = cycleLength(this.spec);
      for (var i = 0; i <= 40; i++) { var q = solve(poseAt(this.spec, total * i / 40).pose, this.spec.view)[j]; d.push((i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)); }

    p.aF.setAttribute('points', pts([s.shF, s.elF, s.wrF]));

    [['fN', s.anN, s.toeN], ['fF', s.anF, s.toeF]].forEach(function (x) { p[x[0]].setAttribute('x1', x[1][0]); p[x[0]].setAttribute('y1', x[1][1]); p[x[0]].setAttribute('x2', x[2][0]); p[x[0]].setAttribute('y2', x[2][1]); });
    var tw = (this.spec.props || []).filter(function (q) { return q.k === 'towel'; })[0];
    if (tw) { var to = tw.to || s.wrF; p.towel.setAttribute('x1', s.wrN[0]); p.towel.setAttribute('y1', s.wrN[1]); p.towel.setAttribute('x2', to[0]); p.towel.setAttribute('y2', to[1]); }
    p.torso.setAttribute('x1', s.hip[0]); p.torso.setAttribute('y1', s.hip[1]); p.torso.setAttribute('x2', s.neck[0]); p.torso.setAttribute('y2', s.neck[1]);
    var hb = add(s.neck, dir(this.spec.keys[0].p.t), 0);
    p.neck.setAttribute('x1', hb[0]); p.neck.setAttribute('y1', hb[1]); p.neck.setAttribute('x2', s.head[0]); p.neck.setAttribute('y2', s.head[1]);
    p.head.setAttribute('cx', s.head[0]); p.head.setAttribute('cy', s.head[1]);

(function () {

  var App = window.App, S = window.MCStore;

  document.getElementById('nav').innerHTML = NAV.map(function (n) { return '<button data-page="' + n[0] + '"><span class="ico" aria-hidden="true">' + n[1] + '</span><span>' + n[2] + '<small class="en" dir="ltr">' + n[3] + '</small></span></button>'; }).join('');
  document.getElementById('appver').textContent = S.APP_VERSION + ' · ' + window.MCEngine.RULES;
  try { var th = localStorage.getItem('MCC_V5_THEME'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
  App.db = S.load();
  App.acts.theme = function () { var r = document.documentElement, n = r.dataset.theme === 'light' ? 'dark' : 'light'; r.dataset.theme = n; try { localStorage.setItem('MCC_V5_THEME', n); } catch (e) { /* ignore */ } };
  document.addEventListener('click', function (e) {
    var nb = e.target.closest('nav.side button[data-page]'); if (nb) { App.go(nb.dataset.page); return; }
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var fn = App.acts[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
  });
  document.addEventListener('submit', function (e) { var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); var fn = App.forms[f.dataset.form]; if (fn) fn(f, e); });
  document.addEventListener('change', function (e) { var el = e.target; if (el.id === 'activeTrainee') { App.ui.traineeId = el.value || null; App.ui.planId = null; App.ui.revPlan = null; App.ui.run = null; App.ui.screenMode = null; App.render(); return; } var fn = App.changes[el.id]; if (fn) fn(el, e); });
